<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }body {
  background: linear-gradient(135deg, #ff9ec4, #ffd6e8, #fff0f6);
  overflow: hidden;
}

.page {
  width: 100vw;
  height: 100vh;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  animation: fade 0.8s ease;
}

.active {
  display: flex;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

h1 {
  color: #ff2e7a;
  font-size: 3rem;
  margin-bottom: 10px;
}

h2 {
  color: #ff4081;
  margin-top: 10px;
  font-size: 2rem;
}

p {
  color: #555;
  margin-top: 10px;
  font-size: 1.1rem;
}

button {
  margin-top: 25px;
  padding: 12px 28px;
  border: none;
  border-radius: 30px;
  background: #ff4081;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(255, 64, 129, 0.35);
  transition: transform 0.2s ease, background 0.2s ease;
}

button:hover {
  background: #e91e63;
  transform: translateY(-2px);
}

.main-card {
  background: white;
  padding: 40px 30px;
  border-radius: 24px;
  box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
  max-width: 380px;
  width: 100%;
}

.cake {
  position: relative;
  width: 220px;
  height: 200px;
  margin-top: 20px;
}

.layer {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 16px;
  background: #ff6f91;
  box-shadow: inset 0 -10px 0 rgba(255, 255, 255, 0.35);
}

.layer.bottom {
  width: 220px;
  height: 90px;
  bottom: 0;
}

.layer.middle {
  width: 170px;
  height: 70px;
  bottom: 70px;
  background: #ff85a2;
}

.layer.top {
  width: 120px;
  height: 52px;
  bottom: 126px;
  background: #ffa5ba;
}

.candle {
  position: absolute;
  width: 14px;
  height: 46px;
  background: repeating-linear-gradient(45deg, #fff, #fff 6px, #ff4081 6px, #ff4081 12px);
  left: 50%;
  top: 14px;
  transform: translateX(-50%);
  border-radius: 8px;
}

.flame {
  position: absolute;
  width: 20px;
  height: 30px;
  background: radial-gradient(circle at 50% 35%, #fff6b0 0%, #ffd54f 45%, #ff9800 100%);
  border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
  left: 50%;
  top: -22px;
  transform: translateX(-50%);
  animation: flicker 0.8s infinite alternate;
  box-shadow: 0 0 18px rgba(255, 193, 7, 0.75);
}

@keyframes flicker {
  from {
    transform: translateX(-50%) scale(1);
  }
  to {
    transform: translateX(-50%) scale(1.08);
  }
}

.photos {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 20px;
}

.photos img {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 18px;
  border: 4px solid white;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
}

.teddy {
  position: relative;
  width: 210px;
  height: 260px;
  margin-top: 10px;
}

.teddy .head {
  width: 120px;
  height: 110px;
  background: #b97a56;
  border-radius: 50%;
  position: absolute;
  top: 0;
  left: 45px;
}

.teddy .ear {
  width: 42px;
  height: 42px;
  background: #b97a56;
  border-radius: 50%;
  position: absolute;
  top: -10px;
}

.teddy .ear.left {
  left: 34px;
}

.teddy .ear.right {
  right: 34px;
}

.teddy .body {
  width: 150px;
  height: 130px;
  background: #c98b63;
  border-radius: 50%;
  position: absolute;
  bottom: 0;
  left: 30px;
}

.teddy .eye {
  width: 10px;
  height: 10px;
  background: #222;
  border-radius: 50%;
  position: absolute;
  top: 42px;
}

.teddy .eye.left {
  left: 78px;
}

.teddy .eye.right {
  right: 78px;
}

.teddy .snout {
  width: 38px;
  height: 26px;
  background: #f4d2bf;
  border-radius: 50%;
  position: absolute;
  top: 58px;
  left: 86px;
  transform: translateX(-50%);
}

.teddy .card {
  position: absolute;
  width: 170px;
  height: 100px;
  background: white;
  border-radius: 16px;
  top: 118px;
  left: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px;
  color: #ff2e7a;
  font-weight: 700;
  line-height: 1.3;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  border: 2px dashed #ff9ec4;
}

.gifts {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 20px;
  font-size: 4rem;
}

.gift-box {
  width: 110px;
  height: 110px;
  background: white;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
}

  </style>
</head>
